<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digest - Job Notification Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="jobs.css">
  <link rel="stylesheet" href="digest.css">
</head>
<body>
  <div class="app-container">
    <nav class="main-nav">
      <div class="main-nav__container">
        <div class="main-nav__brand">Job Notification Tracker</div>
        <div class="main-nav__links">
          <a href="dashboard.html" class="main-nav__link">Dashboard</a>
          <a href="saved.html" class="main-nav__link">Saved</a>
          <a href="digest.html" class="main-nav__link main-nav__link--active">Digest</a>
          <a href="settings.html" class="main-nav__link">Settings</a>
          <a href="proof.html" class="main-nav__link">Proof</a>
        </div>
        <button class="main-nav__hamburger" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    <main class="page-content">
      <h1 class="mb-sm">Daily Digest</h1>
      <p class="text-secondary mb-lg">Your personalized job recommendations delivered at 9AM.</p>
      
      <!-- No Preferences Banner -->
      <div id="noPreferencesBanner" class="error-message" style="display: none;">
        <div class="error-message__title">Set preferences to generate a personalized digest.</div>
        <p class="error-message__description">Configure your job preferences to receive tailored recommendations.</p>
        <a href="settings.html" class="btn btn--primary btn--small">Go to Settings</a>
      </div>
      
      <!-- Generate Button -->
      <div style="margin-bottom: 24px;">
        <button id="generateButton" class="btn btn--primary" onclick="generateDigest()">
          Generate Today's 9AM Digest (Simulated)
        </button>
      </div>
      
      <!-- Recent Status Updates -->
      <div id="statusHistorySection" style="margin-bottom: 32px;"></div>
      
      <!-- Digest Container -->
      <div id="digestContainer"></div>
    </main>
    
    <!-- Job Details Modal -->
    <div id="jobModal" class="modal">
      <div class="modal__content" id="modalContent"></div>
    </div>
  </div>

  <script src="navigation.js"></script>
  <script src="jobs-data.js"></script>
  <script src="app.js"></script>
  <script src="digest.js"></script>
</body>
</html>
