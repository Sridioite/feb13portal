<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Job Notification Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="jobs.css">
</head>
<body>
  <div class="app-container">
    <nav class="main-nav">
      <div class="main-nav__container">
        <div class="main-nav__brand">Job Notification Tracker</div>
        <div class="main-nav__links">
          <a href="dashboard.html" class="main-nav__link main-nav__link--active">Dashboard</a>
          <a href="saved.html" class="main-nav__link">Saved</a>
          <a href="digest.html" class="main-nav__link">Digest</a>
          <a href="settings.html" class="main-nav__link">Settings</a>
          <a href="proof.html" class="main-nav__link">Proof</a>
        </div>
        <button class="main-nav__hamburger" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    <main class="page-content">
      <h1 class="mb-sm">Job Dashboard</h1>
      <p class="text-secondary mb-lg">Browse and discover precision-matched opportunities.</p>
      
      <!-- Preferences Banner -->
      <div id="preferencesBanner" class="warning-message" style="display: none;">
        <div class="warning-message__title">Set your preferences to activate intelligent matching.</div>
        <p style="margin: 8px 0 0 0;">
          <a href="settings.html" class="btn btn--primary btn--small">Configure Preferences</a>
        </p>
      </div>
      
      <div class="filter-bar">
        <div class="filter-bar__row">
          <div>
            <label class="filter-bar__label">Search</label>
            <input type="text" id="keywordSearch" class="input" placeholder="Search by title or company">
          </div>
          <div>
            <label class="filter-bar__label">Status</label>
            <select id="statusFilter" class="input">
              <option value="all">All Status</option>
              <option value="Not Applied">Not Applied</option>
              <option value="Applied">Applied</option>
              <option value="Rejected">Rejected</option>
              <option value="Selected">Selected</option>
            </select>
          </div>
          <div>
            <label class="filter-bar__label">Location</label>
            <select id="locationFilter" class="input">
              <option value="all">All Locations</option>
              <option value="Bangalore">Bangalore</option>
              <option value="Pune">Pune</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Chennai">Chennai</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Noida">Noida</option>
              <option value="Mysore">Mysore</option>
            </select>
          </div>
          <div>
            <label class="filter-bar__label">Mode</label>
            <select id="modeFilter" class="input">
              <option value="all">All Modes</option>
              <option value="Remote">Remote</option>
              <option value="Hybrid">Hybrid</option>
              <option value="Onsite">Onsite</option>
            </select>
          </div>
          <div>
            <label class="filter-bar__label">Experience</label>
            <select id="experienceFilter" class="input">
              <option value="all">All Levels</option>
              <option value="Fresher">Fresher</option>
              <option value="0-1">0-1 years</option>
              <option value="1-3">1-3 years</option>
              <option value="3-5">3-5 years</option>
            </select>
          </div>
          <div>
            <label class="filter-bar__label">Source</label>
            <select id="sourceFilter" class="input">
              <option value="all">All Sources</option>
              <option value="LinkedIn">LinkedIn</option>
              <option value="Naukri">Naukri</option>
              <option value="Indeed">Indeed</option>
            </select>
          </div>
          <div>
            <label class="filter-bar__label">Sort By</label>
            <select id="sortFilter" class="input">
              <option value="latest">Latest First</option>
              <option value="match">Match Score</option>
              <option value="salary">Salary</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center;">
          <label class="checkbox-option" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="showOnlyMatches">
            <span style="font-size: 15px; font-weight: 500;">Show only jobs above my threshold</span>
          </label>
          <button class="btn btn--secondary btn--small" onclick="clearAllFilters()">Clear Filters</button>
        </div>
      </div>
      
      <div class="jobs-grid" id="jobsContainer"></div>
    </main>
    
    <!-- Job Details Modal -->
    <div id="jobModal" class="modal">
      <div class="modal__content" id="modalContent"></div>
    </div>
  </div>

  <script src="navigation.js"></script>
  <script src="jobs-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
